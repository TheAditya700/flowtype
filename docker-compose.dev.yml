services:
  # ----------------------------------------------------------------
  # Development Environment
  # ----------------------------------------------------------------
  
  postgres_dev:
    image: postgres:15-alpine
    container_name: flowtype_postgres_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=flowtype_dev
      - POSTGRES_PASSWORD=flowtype_dev
      - POSTGRES_DB=flowtype_dev
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtype_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_dev:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowtype_backend_dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      postgres_dev:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: flowtype_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pg_data_dev:
